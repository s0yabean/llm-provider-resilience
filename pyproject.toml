[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-provider-resilience"
version = "0.1.0"
description = "Provider-agnostic fallback chains, credential pools and circuit breakers for LLM calls"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tony Tong" }]
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
