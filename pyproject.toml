[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-provider-resilience"
version = "0.1.0"
description = "Provider-agnostic fallback chains, credential pools and circuit breakers for LLM calls"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tony Tong" }]
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's classic defaults (pyflakes + pycodestyle errors) plus bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# zip(a, a[1:]) and similar pairings are deliberately uneven; strict= would break them.
ignore = ["B905"]
